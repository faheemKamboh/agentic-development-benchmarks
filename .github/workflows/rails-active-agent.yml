name: Active Rails agent benchmark

on:
  push:
    branches: [rails-active-agent-benchmark]
    paths:
      - .github/workflows/rails-active-agent.yml
      - rails_active_agent.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rails-active-agent-v2
  cancel-in-progress: true

jobs:
  attack-test:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - slug: qwen35-4b
            label: Qwen3.5-4B Q4_K_M
            hf: bartowski/Qwen_Qwen3.5-4B-GGUF:Q4_K_M
          - slug: qwen35-9b
            label: Qwen3.5-9B Q4_K_M
            hf: bartowski/Qwen_Qwen3.5-9B-GGUF:Q4_K_M
          - slug: rails-qwen3-8b
            label: Qwen3-8B Rails specialist Q4_K_M
            hf: bytecodehr/qwen3-8b-rails:Q4_K_M
          - slug: lfm25-26b
            label: LFM2.5-2.6B Q4_K_M
            hf: LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M

    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODEL_SLUG: ${{ matrix.slug }}
      MODEL_LABEL: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare disposable freshFruit target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" clone --depth=1 https://github.com/faheemKamboh/freshFruit.git /tmp/freshFruit
          rm -f /tmp/freshFruit/.git/config
          cat >/tmp/freshFruit/Dockerfile.benchmark <<'DOCKER'
          FROM ruby:3.0.1-bullseye
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential libpq-dev postgresql-client nodejs git curl && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY Gemfile Gemfile.lock ./
          RUN gem install bundler -v 2.2.26 && bundle _2.2.26_ install --jobs 4 --retry 3
          RUN gem install brakeman --no-document
          COPY . .
          ENV RAILS_ENV=test
          CMD ["sleep","infinity"]
          DOCKER
          docker build -f /tmp/freshFruit/Dockerfile.benchmark -t freshfruit-target /tmp/freshFruit
          docker network create --internal freshfruit-net
          docker run -d --name freshfruit-db --network freshfruit-net --network-alias db \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=freshFruit_test postgres:13-alpine
          for i in $(seq 1 60); do
            docker exec freshfruit-db pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name freshfruit-app --network freshfruit-net \
            -e RAILS_ENV=test \
            -e DATABASE_URL=postgres://postgres:postgres@db:5432/freshFruit_test \
            -e SECRET_KEY_BASE=benchmark-only-secret \
            freshfruit-target
          docker exec freshfruit-app bash -lc 'bundle exec rails db:prepare'
          echo 'Baseline Rails test:'
          docker exec freshfruit-app bash -lc 'bundle exec rails test' || true
          echo 'Target ready; network is internal-only.'

      - name: Start model
        run: |
          set -euo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --rm --name benchmark-llm --network host \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf "${{ matrix.hf }}" \
            --alias "${MODEL_SLUG}" \
            --host 127.0.0.1 --port 8080 \
            -c 4096 -np 1 -t 4 -tb 4 \
            --cache-type-k q8_0 --cache-type-v q8_0 \
            --reasoning off --no-ui
          for i in $(seq 1 300); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            if ! docker ps --format '{{.Names}}' | grep -qx benchmark-llm; then
              echo 'Model container exited'
              docker ps -a
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Let model investigate and prove findings
        run: python3 rails_active_agent.py

      - name: Capture target state
        if: always()
        run: |
          mkdir -p active-output
          docker exec freshfruit-app bash -lc 'git diff -- . || true' > active-output/target-diff.txt 2>&1 || true
          docker logs freshfruit-db > active-output/postgres.log 2>&1 || true

      - name: Upload active benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rails-active-${{ matrix.slug }}
          path: active-output/
          retention-days: 3
