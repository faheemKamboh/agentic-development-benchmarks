name: Rails specialist benchmark

on:
  push:
    branches:
      - rails-specialist-benchmark
    paths:
      - .github/workflows/rails-specialist-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /

      - name: Download Rails specialist
        run: |
          set -euo pipefail
          python3 -m venv /tmp/hf
          /tmp/hf/bin/pip install -q --upgrade pip
          /tmp/hf/bin/pip install -q 'huggingface_hub[hf_xet]'
          mkdir -p /tmp/rails-model
          export HF_XET_HIGH_PERFORMANCE=1
          /tmp/hf/bin/python -c "from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id='bytecodehr/qwen3-8b-rails', filename='qwen3-8b-rails-Q4_K_M.gguf', local_dir='/tmp/rails-model'))"
          ls -lh /tmp/rails-model/qwen3-8b-rails-Q4_K_M.gguf

      - name: Start model
        run: |
          set -euo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --rm \
            --name rails-llm \
            --network host \
            -v /tmp/rails-model:/models:ro \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen3-8b-rails-Q4_K_M.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -np 1 \
            -t 4 \
            -tb 4 \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            --reasoning off \
            --no-ui
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            if ! docker ps --format '{{.Names}}' | grep -qx rails-llm; then
              docker logs rails-llm || true
              exit 1
            fi
            sleep 2
          done
          docker logs rails-llm || true
          exit 1

      - name: Run freshFruit repo benchmark
        run: python3 rails_specialist_benchmark.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: rails-specialist-results
          path: benchmark-output/
          retention-days: 3
