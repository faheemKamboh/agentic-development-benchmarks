name: Rails model bake-off

on:
  push:
    branches:
      - rails-specialist-benchmark
    paths:
      - .github/workflows/rails-specialist-benchmark.yml
      - rails_specialist_benchmark.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rails-model-bakeoff-v2
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - slug: rails-qwen3-8b
            label: Qwen3-8B Rails specialist Q4_K_M
            hf: bytecodehr/qwen3-8b-rails:Q4_K_M
          - slug: qwen35-4b
            label: Qwen3.5-4B Q4_K_M
            hf: bartowski/Qwen_Qwen3.5-4B-GGUF:Q4_K_M
          - slug: qwen35-9b
            label: Qwen3.5-9B Q4_K_M
            hf: bartowski/Qwen_Qwen3.5-9B-GGUF:Q4_K_M
          - slug: qwen35-4b-coder
            label: Qwen3.5-4B Agentic Coder v4 Q4_K_M
            hf: mradermacher/qwen3.5-4b-agentic-coder-v4-i1-GGUF:Q4_K_M
          - slug: lfm25-26b
            label: LFM2.5-2.6B Q4_K_M
            hf: LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M

    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_SLUG: ${{ matrix.slug }}
      MODEL_LABEL: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "Model: ${MODEL_LABEL}"
          nproc
          free -h
          df -h /

      - name: Start ${{ matrix.label }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --rm \
            --name benchmark-llm \
            --network host \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf "${{ matrix.hf }}" \
            --alias "${MODEL_SLUG}" \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -np 1 \
            -t 4 \
            -tb 4 \
            --cache-type-k q8_0 \
            --cache-type-v q8_0 \
            --reasoning off \
            --no-ui

          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "${MODEL_LABEL} ready"
              free -h
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx benchmark-llm; then
              echo "Model container exited:"
              docker logs benchmark-llm || true
              exit 1
            fi
            sleep 2
          done
          docker logs benchmark-llm || true
          exit 1

      - name: Run freshFruit repo benchmark v2
        run: python3 rails_specialist_benchmark.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: rails-benchmark-v2-${{ matrix.slug }}
          path: benchmark-output/
          retention-days: 3
